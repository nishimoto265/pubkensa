# Copy into a repository as .github/workflows/aratame.yml
# After aratame is published, replace the build step with a released binary.
name: aratame

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  aratame:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cd "$tmp"
          curl -fsSL -O "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -O "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23"

      # After a public release, prefer a pinned binary. Until then, build from
      # a checkout of this source (replace the path) or drop a prebuilt binary in PATH.
      - name: Install aratame
        run: go install github.com/nishimoto265/aratame/cmd/aratame@main

      - name: Run aratame
        run: aratame scan
