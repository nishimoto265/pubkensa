# Draft only. Do not run `goreleaser release` (or snapshot-to-publish)
# until the repository is public and a tag is explicitly approved.
version: 2

project_name: pubkensa

before:
  hooks:
    - go mod tidy

builds:
  - id: pubkensa
    main: ./cmd/pubkensa
    binary: pubkensa
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: pubkensa
    ids:
      - pubkensa
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: nishimoto265
    name: pubkensa
  name_template: "{{ .Tag }}"
  header: |
    pubkensa is a small pre-publish gate for Git repositories. One command
    runs three checks: secrets (delegated to gitleaks), a deny list you
    provide, and an author/committer email policy (default: GitHub
    noreply addresses).

    It does not rewrite history, fix files, or change repository settings.
    gitleaks must be installed separately and available on PATH.
  footer: |
    ---

    Install: see the README — a release binary, or
    `go install github.com/nishimoto265/pubkensa/cmd/pubkensa@latest`
    after this repository is public. Secret detection is performed by
    gitleaks, which has its own license.
